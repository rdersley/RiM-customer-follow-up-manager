app:
  # Retail inMotion has its own Forge app. Replace with the id printed by:
  #   forge register "Retail inMotion Customer Follow-Up Manager"
  id: ari:cloud:ecosystem::app/REPLACE-WITH-RETAIL-INMOTION-APP-ID
  runtime:
    name: nodejs22.x

modules:
  jira:projectSettingsPage:
    - key: retailinmotion-settings
      resource: admin-ui
      resolver:
        function: ui-resolver
      title: Retail inMotion Follow-Up Manager
      layout: blank

  jira:issuePanel:
    - key: retailinmotion-issue-panel
      resource: issue-panel-ui
      resolver:
        function: ui-resolver
      title: Retail inMotion Follow-Up
      icon: resource:issue-panel-ui;icons/followup.svg
      viewportSize: medium

  trigger:
    - key: retailinmotion-issue-upd
      function: issue-handler
      events:
        - avi:jira:updated:issue
    - key: retailinmotion-comment
      function: comment-handler
      events:
        - avi:jira:commented:issue

  scheduledTrigger:
    - key: retailinmotion-hourly
      function: followup-processor
      interval: hour
    - key: retailinmotion-privacy
      function: privacy-handler
      interval: week

  function:
    - key: issue-handler
      handler: index.onIssueUpdated
    - key: comment-handler
      handler: index.onCommentCreated
    - key: followup-processor
      handler: index.processDueFollowUps
      timeoutSeconds: 900
    - key: privacy-handler
      handler: privacy.processPrivacy
    - key: ui-resolver
      handler: ui-resolver.handler

resources:
  - key: admin-ui
    path: static/admin/dist
  - key: issue-panel-ui
    path: static/issue-panel/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
    - storage:app
    - report:personal-data
